### GraphRAG configuration for Swiss legal corpus (Omnilex competition)
### Full config reference: https://microsoft.github.io/graphrag/config/yaml/
###
### Variables to set in graphrag/.env:
###   GRAPHRAG_API_KEY    - academic cloud key (already set)
###   GRAPHRAG_API_BASE   - https://chat-ai.academiccloud.de/v1
###   GRAPHRAG_CHAT_MODEL - qwen3.5-27b
###   MISTRAL_API_KEY     - free from https://console.mistral.ai/

### LLM settings ###

completion_models:
  default_completion_model:
    model_provider: openai
    model: ${GRAPHRAG_CHAT_MODEL}
    api_key: ${GRAPHRAG_API_KEY}
    api_base: ${GRAPHRAG_API_BASE}
    auth_method: api_key
    request_timeout: 180.0
    max_retries: 5
    retry:
      type: exponential_backoff
    tokens_per_minute: 40000
    requests_per_minute: 60
    concurrent_requests: 4

# Embeddings use Mistral AI (free trial, multilingual, OpenAI-compatible).
# Model: mistral-embed — supports German, French, Italian (Swiss law corpus).
# Get a free API key at: https://console.mistral.ai/  (no credit card needed)
embedding_models:
  default_embedding_model:
    model_provider: openai
    model: mistral-embed
    api_key: ${MISTRAL_API_KEY}
    api_base: https://api.mistral.ai/v1
    auth_method: api_key
    request_timeout: 60.0
    max_retries: 5
    retry:
      type: exponential_backoff
    tokens_per_minute: 500000
    requests_per_minute: 60
    concurrent_requests: 4

### Document processing settings ###

input:
  type: text

# Legal articles are shorter than general documents; smaller chunks keep
# individual provisions intact while allowing overlap for context.
chunking:
  type: tokens
  size: 600
  overlap: 100
  encoding_model: o200k_base

### Storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

input_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "input"

output_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "output"

reporting:
  type: file # [file, blob]
  base_dir: "logs"

cache:
  type: json # [json, memory, none]
  storage:
    type: file # [file, blob, cosmosdb]
    base_dir: "cache"
    
vector_store:
  type: lancedb
  db_uri: output/lancedb

### Workflow settings ###

embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  # Legal entity types relevant to Swiss law
  entity_types:
    - legal_provision    # law articles (Art. 1 OR, Art. 104 ZGB)
    - court_decision     # BGE citations
    - legal_concept      # abstract legal concepts (contract, liability)
    - legal_code         # statutes and codes (OR, ZGB, StGB, USG)
    - legal_principle    # principles of law (good faith, proportionality)
    - legal_party        # courts, authorities, entities in proceedings
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english # [regex_english, syntactic_parser, cfg]

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: false
  embeddings: false

### Query settings ###
## The prompt locations are required here, but each search method has a number of optional knobs that can be tuned.
## See the config docs: https://microsoft.github.io/graphrag/config/yaml/#query

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
